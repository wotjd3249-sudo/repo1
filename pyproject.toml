[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "bbauto"
version = "1.0.0"
description = "권한 기반 버그바운티 자동화 파이프라인 (HackerOne 연동)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "requests>=2.31.0",
    "PyYAML>=6.0.1",
]

[project.scripts]
bbauto = "bbauto.cli:main"

[tool.setuptools]
packages = ["bbauto"]
