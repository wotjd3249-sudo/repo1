name: bb-auto scan

# HackerOne 스코프를 자동 수집해 "권한 범위"만 스캔하고, 리포트를 이 리포에 커밋합니다.
#
# 리포 Settings 에서 미리 설정하세요:
#   Secrets (Settings > Secrets and variables > Actions > Secrets):
#     H1_API_TOKEN   (필수)  HackerOne API 토큰
#     H1_USERNAME    (필수)  HackerOne 로그인 아이디
#     SLACK_WEBHOOK  (선택)  Slack 알림
#     DISCORD_WEBHOOK(선택)  Discord 알림
#   Variables (Settings > Secrets and variables > Actions > Variables):
#     AUTHORIZED = true      ← 이 값이 true 여야만 스캔이 실행됩니다.
#                              "스코프 대상에 테스트 권한이 있다"는 확인입니다.
#     ENABLE_NUCLEI = true   (선택) nuclei 경량 능동 탐지 활성화

on:
  schedule:
    - cron: "17 3 * * *"   # 매일 03:17 UTC (정각 회피)
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 설치
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: 권한(AUTHORIZED) 확인
        if: ${{ vars.AUTHORIZED != 'true' }}
        run: |
          echo "::warning::리포 Variable AUTHORIZED 가 true 가 아니어서 스캔을 건너뜁니다."
          echo "스코프 대상에 테스트 권한이 있음을 확인한 뒤 Settings > Variables 에서 AUTHORIZED=true 로 설정하세요."

      - name: (선택) nuclei 설치
        if: ${{ vars.AUTHORIZED == 'true' && vars.ENABLE_NUCLEI == 'true' }}
        run: |
          go install -v github.com/projectdiscovery/nuclei/v3/cmd/nuclei@latest || true
          echo "$HOME/go/bin" >> "$GITHUB_PATH"

      - name: config.yaml 생성
        if: ${{ vars.AUTHORIZED == 'true' }}
        run: cp config.example.yaml config.yaml

      - name: 스캔 실행
        if: ${{ vars.AUTHORIZED == 'true' }}
        env:
          H1_USERNAME: ${{ secrets.H1_USERNAME }}
          H1_API_TOKEN: ${{ secrets.H1_API_TOKEN }}
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          NUCLEI_ENABLED: ${{ vars.ENABLE_NUCLEI }}
        run: |
          # Secrets/Variables 를 config 에 주입 (토큰/webhook 은 코드·리포에 하드코딩하지 않음)
          python - <<'PY'
          import os, yaml
          with open("config.yaml") as f:
              c = yaml.safe_load(f)
          c["authorized"] = True              # AUTHORIZED=true 일 때만 이 단계 도달
          c["scope_source"] = "hackerone"     # 토큰은 env(H1_USERNAME/H1_API_TOKEN)로 읽음
          n = c.setdefault("notify", {})
          if os.environ.get("SLACK_WEBHOOK"):   n["slack_webhook"]   = os.environ["SLACK_WEBHOOK"]
          if os.environ.get("DISCORD_WEBHOOK"): n["discord_webhook"] = os.environ["DISCORD_WEBHOOK"]
          g = c.setdefault("github", {})       # 현재 체크아웃된 리포에 직접 커밋
          g["enabled"] = True; g["repo_dir"] = "."; g["remote"] = ""
          if os.environ.get("NUCLEI_ENABLED") == "true":
              c.setdefault("modules", {})["nuclei"] = True
          with open("config.yaml", "w") as f:
              yaml.safe_dump(c, f, allow_unicode=True)
          PY
          bbauto run

      - name: 리포트 커밋
        if: ${{ vars.AUTHORIZED == 'true' }}
        run: |
          git config user.name "bb-auto"
          git config user.email "bb-auto@users.noreply.github.com"
          # reports/state 는 .gitignore 대상이므로 강제 추가(-f)
          git add -f reports latest.md state 2>/dev/null || true
          git commit -m "scan: $(date -u +%FT%TZ) 리포트" || echo "변경 없음"
          git push || echo "푸시 생략"
